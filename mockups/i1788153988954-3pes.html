<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הדיווחים לא במסך הבית — שלוש אפשרויות</title>
<style>
  :root{
    --bg:#f6efe2; --bg2:#efe4d0; --card:#fdfaf3; --ink:#42332a; --muted:#7a6857;
    --accent:#a34c17; --accent2:#c07a2c; --accent-soft:#f4e3cd; --line:#dfcfb5;
    --frame:#b98d54;
    --shadow:0 3px 12px rgba(66,51,42,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Arial Hebrew","Noto Sans Hebrew",sans-serif;
    padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 28px);
    font-size:16px; line-height:1.6;
  }
  .wrap{max-width:760px; margin:0 auto;}
  h1{font-size:20px; margin:0 0 6px;}
  .sub{color:var(--muted); font-size:14.5px; margin:0;}
  .why{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin:16px 0 22px; box-shadow:var(--shadow);
  }
  .why b{color:var(--accent);}
  .why p{margin:0 0 8px;}
  .why p:last-child{margin:0;}

  .opt{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px; margin-bottom:20px; box-shadow:var(--shadow);
  }
  .opt.pick{border:2px solid var(--frame);}
  .opt h2{font-size:17px; margin:0 0 4px; color:var(--accent);}
  .opt .note{font-size:14.5px; color:var(--muted); margin:0 0 12px;}
  .pick-tag{
    display:inline-block; font-size:12px; font-weight:800; border-radius:20px;
    padding:3px 11px; background:var(--accent-soft); color:var(--accent);
    margin-bottom:6px;
  }
  .pros{margin:12px 0 0; padding:0; list-style:none; font-size:14.5px;}
  .pros li{margin-bottom:5px; padding-inline-start:20px; position:relative;}
  .pros li::before{
    content:"+"; position:absolute; inset-inline-start:0; color:var(--accent); font-weight:800;
  }
  .pros li.con::before{content:"−"; color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <h1>הדיווחים שלי — לא במסך הבית</h1>
  <p class="sub">דיווח i1788153988954-3pes · מוקאפ להחלטה · 402×874</p>
</div>
</body>
</html>
